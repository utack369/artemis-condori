name: verify-post

# 冪等性: pending無し／published済みなら何もしない。複数回実行は安全。
on:
  schedule:
    - cron: "15 11 * * *"   # 20:15 JST 初回検死（公開15分後）
    - cron: "15 12 * * *"   # 21:15 JST 再試行後の再検証
    - cron: "15 14 * * *"   # 23:15 JST 遅延公開・2回目再試行の検証
    - cron: "0 22 * * *"    # 07:00 JST 最終確認（監視③7:30の前）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry-run（再試行・pending削除をスキップ）"
        type: boolean
        default: false

concurrency:
  group: verify-post
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests boto3

      - name: Restore config.json
        env:
          CONFIG_JSON: ${{ secrets.ARTEMIS_CONFIG_JSON }}
        run: |
          if [ -z "$CONFIG_JSON" ]; then
            echo "::error::Secret ARTEMIS_CONFIG_JSON が未登録です"
            exit 1
          fi
          mkdir -p "$HOME/artemis-media/自動取得システム"
          printf '%s' "$CONFIG_JSON" > "$HOME/artemis-media/自動取得システム/config.json"

      - name: Run verify_post --from-s3
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/verify_post.py --from-s3 --dry-run
          else
            python scripts/verify_post.py --from-s3
          fi
